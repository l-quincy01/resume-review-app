name: Deploy Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - apps/web/**
      - packages/**
      - infra/azure-container-apps/**
      - scripts/security/check-edge-key-redaction.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - resume-tracker.sln
      - .github/workflows/deploy-azure-container-apps.yml

permissions:
  contents: read

concurrency:
  group: deploy-azure-container-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
  AZURE_CONTAINER_APP_ENV: ${{ vars.AZURE_CONTAINER_APP_ENV }}
  AZURE_WEB_APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
  AZURE_API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
  WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  API_ALLOWED_HOSTS: ${{ vars.API_ALLOWED_HOSTS }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  EDGE_LOG_SEARCH_COMMAND: ${{ vars.EDGE_LOG_SEARCH_COMMAND }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            AZURE_RESOURCE_GROUP
            AZURE_CONTAINER_REGISTRY
            AZURE_CONTAINER_APP_ENV
            AZURE_WEB_APP_NAME
            AZURE_API_APP_NAME
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions variable: ${name}" >&2
              exit 2
            fi
          done

          if [[ -n "${WEB_BASE_URL:-}" && "${WEB_BASE_URL}" != https://* ]]; then
            echo "WEB_BASE_URL must be an HTTPS origin in production." >&2
            exit 2
          fi

          if [[ -n "${API_BASE_URL:-}" && "${API_BASE_URL}" != https://* ]]; then
            echo "API_BASE_URL must be an HTTPS origin in production." >&2
            exit 2
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prepare Azure CLI
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade

      - name: Create resource group
        shell: bash
        run: |
          set -euo pipefail
          az group create \
            --name "${AZURE_RESOURCE_GROUP}" \
            --location "${AZURE_LOCATION:-eastus}"

      - name: Deploy foundation
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure-container-apps/foundation.bicep \
            --parameters \
              location="${AZURE_LOCATION:-eastus}" \
              registryName="${AZURE_CONTAINER_REGISTRY}" \
              environmentName="${AZURE_CONTAINER_APP_ENV}"

      - name: Build and push API image
        id: images
        shell: bash
        run: |
          set -euo pipefail

          acr_login_server="$(az acr show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_CONTAINER_REGISTRY}" \
            --query loginServer \
            --output tsv)"

          az acr login --name "${AZURE_CONTAINER_REGISTRY}"

          api_image="${acr_login_server}/resume-review-api:${GITHUB_SHA}"

          docker build \
            --file apps/api/Dockerfile \
            --tag "${api_image}" \
            .

          docker push "${api_image}"

          echo "acr_login_server=${acr_login_server}" >> "${GITHUB_OUTPUT}"
          echo "api_image=${api_image}" >> "${GITHUB_OUTPUT}"

      - name: Deploy API bootstrap
        id: api_bootstrap
        shell: bash
        run: |
          set -euo pipefail

          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure-container-apps/api-container-app.bicep \
            --parameters \
              location="${AZURE_LOCATION:-eastus}" \
              registryName="${AZURE_CONTAINER_REGISTRY}" \
              environmentName="${AZURE_CONTAINER_APP_ENV}" \
              apiAppName="${AZURE_API_APP_NAME}" \
              apiImage="${{ steps.images.outputs.api_image }}" \
              webBaseUrl="${WEB_BASE_URL:-https://bootstrap.invalid}" \
              apiAllowedHosts="${API_ALLOWED_HOSTS:-*}"

          api_fqdn="$(az containerapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_API_APP_NAME}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          resolved_api_base_url="${API_BASE_URL:-https://${api_fqdn}}"

          echo "api_fqdn=${api_fqdn}" >> "${GITHUB_OUTPUT}"
          echo "api_base_url=${resolved_api_base_url}" >> "${GITHUB_OUTPUT}"

      - name: Build and push web image
        id: web_image
        shell: bash
        run: |
          set -euo pipefail

          web_image="${{ steps.images.outputs.acr_login_server }}/resume-review-web:${GITHUB_SHA}"

          docker build \
            --file apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_BASE=${{ steps.api_bootstrap.outputs.api_base_url }}" \
            --build-arg "LOG_LEVEL=${LOG_LEVEL:-info}" \
            --tag "${web_image}" \
            .

          docker push "${web_image}"

          echo "web_image=${web_image}" >> "${GITHUB_OUTPUT}"

      - name: Deploy web app
        id: web_deploy
        shell: bash
        run: |
          set -euo pipefail

          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure-container-apps/web-container-app.bicep \
            --parameters \
              location="${AZURE_LOCATION:-eastus}" \
              registryName="${AZURE_CONTAINER_REGISTRY}" \
              environmentName="${AZURE_CONTAINER_APP_ENV}" \
              webAppName="${AZURE_WEB_APP_NAME}" \
              webImage="${{ steps.web_image.outputs.web_image }}" \
              apiBaseUrl="${{ steps.api_bootstrap.outputs.api_base_url }}" \
              logLevel="${LOG_LEVEL:-info}"

          web_fqdn="$(az containerapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEB_APP_NAME}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          resolved_web_base_url="${WEB_BASE_URL:-https://${web_fqdn}}"

          echo "web_fqdn=${web_fqdn}" >> "${GITHUB_OUTPUT}"
          echo "web_base_url=${resolved_web_base_url}" >> "${GITHUB_OUTPUT}"

      - name: Finalize API CORS and host settings
        shell: bash
        run: |
          set -euo pipefail

          api_allowed_hosts="${API_ALLOWED_HOSTS:-${{ steps.api_bootstrap.outputs.api_fqdn }}}"

          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/azure-container-apps/api-container-app.bicep \
            --parameters \
              location="${AZURE_LOCATION:-eastus}" \
              registryName="${AZURE_CONTAINER_REGISTRY}" \
              environmentName="${AZURE_CONTAINER_APP_ENV}" \
              apiAppName="${AZURE_API_APP_NAME}" \
              apiImage="${{ steps.images.outputs.api_image }}" \
              webBaseUrl="${{ steps.web_deploy.outputs.web_base_url }}" \
              apiAllowedHosts="${api_allowed_hosts}"

      - name: Smoke test deployed apps
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error "${{ steps.api_bootstrap.outputs.api_base_url }}/health/live" >/dev/null
          curl --fail --silent --show-error "${{ steps.api_bootstrap.outputs.api_base_url }}/health/ready" >/dev/null
          curl --fail --silent --show-error --head "${{ steps.web_deploy.outputs.web_base_url }}" >/dev/null

          echo "API: ${{ steps.api_bootstrap.outputs.api_base_url }}"
          echo "Web: ${{ steps.web_deploy.outputs.web_base_url }}"

      - name: Check edge API key redaction
        if: ${{ vars.EDGE_LOG_SEARCH_COMMAND != '' }}
        shell: bash
        env:
          TEST_OPENAI_API_KEY: sk-test-redaction-check
          LOG_SEARCH_COMMAND: ${{ vars.EDGE_LOG_SEARCH_COMMAND }}
        run: |
          set -euo pipefail

          API_BASE_URL="${{ steps.api_bootstrap.outputs.api_base_url }}" \
            bash scripts/security/check-edge-key-redaction.sh
